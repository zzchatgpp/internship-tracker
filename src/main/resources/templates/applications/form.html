<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${pageTitle + ' | Internship Tracker'}">Application</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<header class="topbar"><a class="brand" th:href="@{/}">Internship Tracker</a><nav class="topbar-nav"><a th:href="@{/}">Dashboard</a><a th:href="@{/applications}">Applications</a><a th:href="@{/applications/new}">Add application</a></nav></header>
<main class="container narrow"><a class="back-link" th:href="@{/applications}">← Back to applications</a><div class="card form-card"><p class="eyebrow">Application details</p><h1 th:text="${pageTitle}"></h1><form th:action="${formAction}" th:object="${applicationRequest}" method="post" novalidate>
<div class="grid-two"><div class="field"><label for="company">Company *</label><input id="company" type="text" th:field="*{company}" maxlength="160"><small class="field-error" th:if="${#fields.hasErrors('company')}" th:errors="*{company}"></small></div><div class="field"><label for="role">Role *</label><input id="role" type="text" th:field="*{role}" maxlength="160"><small class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></small></div></div>
<div class="grid-two"><div class="field"><label for="location">Location</label><input id="location" type="text" th:field="*{location}"></div><div class="field"><label for="appliedDate">Applied date</label><input id="appliedDate" type="date" th:field="*{appliedDate}"></div></div>
<div class="field"><label for="jobUrl">Job URL</label><input id="jobUrl" type="url" th:field="*{jobUrl}"><small class="field-error" th:if="${#fields.hasErrors('jobUrl')}" th:errors="*{jobUrl}"></small></div>
<div class="field"><label for="stage">Stage *</label><select id="stage" th:field="*{stage}"><option th:each="stage : ${stages}" th:value="${stage}" th:text="${stage}"></option></select></div>
<div class="field"><label for="notes">Notes</label><textarea id="notes" th:field="*{notes}" rows="6" maxlength="2000"></textarea></div><div class="form-actions"><a class="button secondary" th:href="@{/applications}">Cancel</a><button class="button" type="submit">Save application</button></div>
</form></div></main></body></html>
