<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Applications | Internship Tracker</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<header class="topbar"><a class="brand" th:href="@{/}">Internship Tracker</a><nav class="topbar-nav"><a th:href="@{/}">Dashboard</a><a th:href="@{/applications}">Applications</a><a th:href="@{/applications/new}">Add application</a></nav><div class="topbar-actions"><span th:text="${currentUser.email}"></span><form th:action="@{/logout}" method="post"><button class="link-button" type="submit">Logout</button></form></div></header>
<main class="container"><div class="page-heading"><div><p class="eyebrow">Your pipeline</p><h1>Internship applications</h1><p class="muted" th:text="${applicationPage.totalElements + (applicationPage.totalElements == 1 ? ' application' : ' applications')}"></p></div><a class="button" th:href="@{/applications/new}">+ Add application</a></div>
<div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>
<form class="card filter-bar" method="get" th:action="@{/applications}"><div class="filter-field filter-search"><label for="q">Search</label><input id="q" name="q" type="search" th:value="${q}" placeholder="Company or role"></div><div class="filter-field"><label for="stage">Stage</label><select id="stage" name="stage"><option value="">All stages</option><option th:each="stage : ${stages}" th:value="${stage}" th:text="${#strings.capitalize(#strings.toLowerCase(stage.name()))}" th:selected="${selectedStage == stage}"></option></select></div><div class="filter-actions"><button class="button" type="submit">Apply filters</button><a class="button secondary" th:href="@{/applications}">Clear</a></div></form>
<div class="empty-state" th:if="${applicationPage.totalElements == 0}"><h2>No applications found</h2><p>Add one or adjust your filters.</p><a class="button" th:href="@{/applications/new}">Add application</a></div>
<div class="card table-wrap" th:if="${applicationPage.totalElements > 0}"><table><thead><tr><th>Company</th><th>Role</th><th>Stage</th><th>Follow-up</th><th>Applied</th><th></th></tr></thead><tbody><tr th:each="application : ${applications}"><td><strong th:text="${application.company}"></strong></td><td th:text="${application.role}"></td><td><span class="badge" th:text="${application.stage}"></span></td><td><span class="follow-up-badge" th:if="${application.followUpNeeded}">Needs follow-up</span><span class="muted" th:unless="${application.followUpNeeded}">—</span></td><td th:text="${application.appliedDate != null ? application.appliedDate : '—'}"></td><td class="actions"><a th:href="@{/applications/{id}(id=${application.id})}">View</a><a th:href="@{/applications/{id}/edit(id=${application.id})}">Edit</a></td></tr></tbody></table></div>
<nav class="pagination" th:if="${applicationPage.totalPages > 1}"><a class="page-link" th:classappend="${applicationPage.first} ? ' disabled'" th:href="${applicationPage.first} ? '#' : @{/applications(page=${applicationPage.number - 1}, q=${q}, stage=${selectedStage})}">Previous</a><a class="page-link" th:each="pageNumber : ${#numbers.sequence(0, applicationPage.totalPages - 1)}" th:classappend="${pageNumber == applicationPage.number} ? ' active'" th:href="@{/applications(page=${pageNumber}, q=${q}, stage=${selectedStage})}" th:text="${pageNumber + 1}"></a><a class="page-link" th:classappend="${applicationPage.last} ? ' disabled'" th:href="${applicationPage.last} ? '#' : @{/applications(page=${applicationPage.number + 1}, q=${q}, stage=${selectedStage})}">Next</a></nav>
</main></body></html>
